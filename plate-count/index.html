<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Plate Count — Tenfold Method</title>
  <meta name="theme-color" content="#1E4A40">
  <meta name="description" content="Plate Count: log your food and training for the Tenfold Method.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Plate Count">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap">
  <link rel="stylesheet" href="css/plate.css">
</head>
<body style="visibility:hidden">

<div class="app">
  <header class="topbar">
    <div class="tb-row">
      <a class="back" href="../portal-dashboard.html" aria-label="Back to portal">&#8249; Portal</a>
      <div class="brand">Plate Count<small id="subtitle"></small></div>
      <button type="button" class="syncpill" id="syncpill" title="Save status"><span class="syncdot" id="syncdot" aria-hidden="true"></span><span id="synctext" role="status" aria-live="polite"></span></button>
    </div>
    <div class="week" id="week"></div>
  </header>

  <main>
    <section id="panel-fuel" role="tabpanel" aria-label="Fuel"></section>
    <section id="panel-train" role="tabpanel" aria-label="Train" hidden></section>
    <section id="panel-trend" role="tabpanel" aria-label="Progress" hidden></section>
  </main>
</div>

<div id="restpill" class="rest" hidden></div>
<div id="toast" class="toast" hidden></div>
<div id="scrim" class="scrim" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle">
  <div class="sh-head"><h2 class="h2" id="shTitle"></h2><button class="x" id="shClose" aria-label="Close">&times;</button></div>
  <div class="sh-body" id="shBody"></div>
  <div class="sh-foot" id="shFoot" hidden></div>
</div></div>

<input type="file" id="scanInput" accept="image/*" capture="environment" hidden>
<input type="file" id="photoInput" accept="image/*" capture="environment" hidden>
<div id="scanRegion" style="display:none"></div>

<nav class="tabs"><div class="tabs-in" role="tablist">
  <button class="tab" role="tab" id="tab-fuel" aria-selected="true">
    <svg viewBox="0 0 24 24"><path d="M5 3v7a3 3 0 0 0 6 0V3M8 13v8"/><path d="M16.5 3c-1.4 2.3-2 4.3-2 6 0 1.6.7 2.6 2 2.6s2-1 2-2.6c0-1.7-.6-3.7-2-6zM16.5 12v9"/></svg><span>Fuel</span></button>
  <button class="tab" role="tab" id="tab-train" aria-selected="false">
    <svg viewBox="0 0 24 24"><path d="M3 9v6M6 7v10M18 7v10M21 9v6M6 12h12"/></svg><span>Train</span></button>
  <button class="tab" role="tab" id="tab-trend" aria-selected="false">
    <svg viewBox="0 0 24 24"><path d="M3 17l5.5-5.5 3.5 3.5L21 6M21 11V6h-5"/></svg><span>Progress</span></button>
</div></nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-client.js"></script>
<script src="foods.js"></script>
<script src="programs.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
