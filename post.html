<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="post-page-title">Post — Tenfold Method</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    .post-body p { font-size: 17px; line-height: 1.75; margin: 0 0 24px; }
    .post-body sup { color: var(--accent); font-weight: 600; }
    .post-body sup a { color: inherit; text-decoration: none; }
    .post-body .cta-line { font-style: italic; color: var(--accent); }
    .post-body h2 { font-size: 24px; font-weight: 600; margin: 12px 0 16px; }
    .post-body h3.table-subheading {
      font-family: var(--font-sans, -apple-system, sans-serif);
      font-size: 13px; letter-spacing: 0.05em; text-transform: uppercase;
      color: var(--accent); font-weight: 600; margin: 36px 0 12px;
    }
    .post-body .table-wrap {
      margin: 0 0 12px; overflow-x: auto; border-radius: 10px; border: 1px solid var(--border);
    }
    .post-body table.exercise-table {
      width: 100%; border-collapse: collapse;
      font-family: var(--font-sans, -apple-system, sans-serif);
      background: var(--surface-2);
    }
    .post-body table.exercise-table th {
      text-align: left; background: var(--bg-accent); color: var(--text-primary);
      font-weight: 600; padding: 12px 16px; font-size: 12px; letter-spacing: 0.04em;
      text-transform: uppercase; border-bottom: 1px solid var(--border);
    }
    .post-body table.exercise-table td {
      padding: 16px; border-bottom: 1px solid var(--border); vertical-align: top;
      font-size: 14px; line-height: 1.55; color: var(--text-secondary);
    }
    .post-body table.exercise-table tr:last-child td { border-bottom: none; }
    .post-body td.exercise-name { font-weight: 600; color: var(--text-primary); white-space: nowrap; }
    .post-body .exercise-sub {
      display: block; font-weight: 400; font-size: 12px; color: var(--text-muted);
      margin-top: 3px; white-space: normal;
    }
    .post-body .table-caption {
      font-family: var(--font-sans, -apple-system, sans-serif);
      font-size: 13px; line-height: 1.6; color: var(--text-muted); margin: 14px 0 30px;
    }
    .footnotes { font-size: 13px; line-height: 1.7; color: var(--text-muted); margin-top: 40px; padding-top: 24px; border-top: 1px solid var(--border); }
    .footnotes-title { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 12px; }
    .footnotes ol { padding-left: 20px; margin: 0; }
    .footnotes li { margin-bottom: 8px; }

    /* --- Added for the "Under Tension" resistance band post --- */
    .post-body .ut-dek { font-size: 18px; color: var(--text-secondary); margin-bottom: 24px; }

    .post-body .ut-claims { list-style: none; margin: 28px 0 0; padding: 0; display: flex; flex-direction: column; gap: 26px; }
    .post-body .ut-claim { display: flex; flex-direction: column; gap: 8px; }
    .post-body .ut-claim-head { display: flex; justify-content: space-between; }
    .post-body .ut-strength-label { font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.1em; color: #5B5F57; }
    .post-body .ut-band-track { position: relative; height: 12px; background: #F1EADB; border: 1px solid #CFC1A2; border-radius: 999px; overflow: hidden; }
    .post-body .ut-band-fill { position: absolute; inset: 0; background: #3E5C4B; border-radius: 999px; }
    .post-body .ut-claim[data-strength="moderate"] .ut-band-fill { opacity: 0.45; }
    .post-body .ut-claim p { margin: 0; font-size: 16px; }

    .post-body .ut-program-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: #CFC1A2; border: 1px solid #CFC1A2; margin: 24px 0; }
    .post-body .ut-program-cell { background: #FAF7F0; padding: 16px 18px; }
    .post-body .ut-program-cell .ut-k { font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #A8583D; display: block; margin-bottom: 6px; }
    .post-body .ut-program-cell .ut-v { font-size: 15px; }
    @media (max-width: 480px) { .post-body .ut-program-grid { grid-template-columns: 1fr; } }

    .post-body .ut-callout { border-left: 3px solid #A8583D; padding: 2px 0 2px 16px; margin: 24px 0 0; color: #5B5F57; font-size: 15px; }
    .post-body .ut-divider { border: none; border-top: 1px solid #CFC1A2; margin: 40px 0 24px; }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="wrap">
      <a href="index.html" class="logo" style="text-decoration:none; color:inherit;">Tenfold</a>
      <nav class="primary-nav">
        <a href="framework.html">The Framework</a>
        <a href="about.html">About</a>
        <a href="blog.html" class="current">Blog</a>
        <a href="pricing.html">Pricing</a>
        <a class="instagram-link" href="https://www.instagram.com/tenfold_health/" aria-label="Instagram" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1"/></svg>
        </a>
        <a class="pill-link" href="portal-login.html">Client portal</a>
      </nav>
    </div>
  </header>

  <main class="wrap" style="max-width:700px;">
    <div style="padding:32px 0 8px;">
      <p class="blog-tag" id="post-tag"></p>
      <h1 id="post-title" style="font-size:30px; line-height:1.25; margin-bottom:8px;"></h1>
      <p class="small" id="post-byline" style="margin-bottom:32px; padding-bottom:24px; border-bottom:1px solid var(--border);"></p>
    </div>

    <div class="post-body" id="post-content">
      <p class="small">Loading...</p>
    </div>

    <div style="padding:32px 0; text-align:center;">
      <a href="blog.html" style="font-size:14px; color:var(--accent);">&larr; Back to all posts</a>
    </div>
  </main>

  <footer>Tenfold Method &nbsp;&middot;&nbsp; In person &amp; virtual training</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script>
    async function checkHasMembership() {
      const { data: sessionData } = await supabaseClient.auth.getSession();
      if (!sessionData.session) return false;

      const email = sessionData.session.user.email;
      const { data: memberships } = await supabaseClient
        .from('memberships')
        .select('*')
        .eq('client_email', email)
        .eq('status', 'active')
        .order('tier', { ascending: false })
        .limit(1);

      const active = memberships && memberships.length ? memberships[0] : null;
      return !!(active && (!active.expires_at || new Date(active.expires_at) > new Date()));
    }

    function getPreviewHtml(fullHtml) {
      const match = fullHtml.match(/<p[^>]*>[\s\S]*?<\/p>/);
      return match ? match[0] : fullHtml.slice(0, 400);
    }

    async function loadPost() {
      const params = new URLSearchParams(window.location.search);
      const postId = params.get('id');
      const contentEl = document.getElementById('post-content');

      if (!postId) {
        contentEl.innerHTML = '<p class="small">Post not found.</p>';
        return;
      }

      const { data: post, error } = await supabaseClient
        .from('posts')
        .select('*')
        .eq('id', postId)
        .single();

      if (error || !post) {
        contentEl.innerHTML = '<p class="small">Post not found.</p>';
        return;
      }

      document.getElementById('post-page-title').textContent = post.title + ' — Tenfold Method';
      document.getElementById('post-tag').textContent = post.tag;
      document.getElementById('post-title').textContent = post.title;
      document.getElementById('post-byline').textContent = 'Sarah · Tenfold Method';

      const hasMembership = await checkHasMembership();

      if (hasMembership) {
        contentEl.innerHTML = post.content;
      } else {
        contentEl.innerHTML = getPreviewHtml(post.content) + `
          <div class="card center" style="margin-top:20px;">
            <h2 style="margin-bottom:6px; font-size:18px;">Continue reading with a membership</h2>
            <p class="small" style="margin-bottom:14px;">Full articles are available to Tenfold Method members, starting at $20/month.</p>
            <a href="membership.html" class="btn btn-primary btn-sm">View memberships</a>
          </div>
        `;
      }
    }
    loadPost();
  </script>

</body>
</html>
