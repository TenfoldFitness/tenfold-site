<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog — Tenfold Method</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <header class="site-header">
    <div class="wrap">
      <a href="index.html" class="logo" style="text-decoration:none; color:inherit;">Tenfold</a>
      <button type="button" class="nav-toggle" id="nav-toggle" aria-label="Menu" aria-expanded="false" aria-controls="primary-nav">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <nav class="primary-nav" id="primary-nav">
        <a href="framework.html">The Framework</a>
        <a href="about.html">About</a>
        <a href="blog.html" class="current">Blog</a>
        <a href="pricing.html">Pricing</a>
        <a class="instagram-link" href="https://www.instagram.com/tenfold_health/" aria-label="Instagram" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1"/></svg>
        </a>
        <a class="pill-link" href="portal-login.html">Client portal</a>
      </nav>
    </div>
  </header>

  <section class="page-banner" style="border-top:none;">
    <div class="giant-mark">10</div>
    <div class="wrap" style="max-width:700px;">
      <p class="section-label"><span class="ten-mark ten-mark-gold">10</span>THE BLOG</p>
      <h1>From the blog</h1>
      <p>Notes on training, nutrition, and the psychology of lasting change.</p>
    </div>
  </section>

  <main class="wrap" style="max-width:700px;">
    <div style="padding:24px 0 8px;">
      <div id="blog-list-full"><p class="small">Loading...</p></div>
    </div>
  </main>

  <footer>Tenfold Method &nbsp;&middot;&nbsp; In person &amp; virtual training</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script>
    function getExcerpt(html) {
      const match = html.match(/<p[^>]*>([\s\S]*?)<\/p>/);
      const text = match ? match[1].replace(/<[^>]+>/g, '') : html.replace(/<[^>]+>/g, '');
      return text.length > 160 ? text.slice(0, 160).trim() + '…' : text;
    }

    async function loadAllPosts() {
      const { data: posts, error } = await supabaseClient
        .from('posts')
        .select('*')
        .order('created_at', { ascending: false });

      const container = document.getElementById('blog-list-full');
      if (error || !posts || !posts.length) {
        container.innerHTML = '<p class="small">No posts published yet — check back soon.</p>';
        return;
      }

      container.innerHTML = posts.map(p => `
        <a href="post.html?id=${p.id}" style="text-decoration:none; color:inherit;">
          <div class="card" style="margin-bottom:14px;">
            <p class="blog-tag">${p.tag}</p>
            <p class="blog-title" style="margin-bottom:6px;">${p.title}</p>
            <p class="small" style="margin:0;">${getExcerpt(p.content)}</p>
          </div>
        </a>
      `).join('');
    }
    loadAllPosts();
  </script>

  <script src="js/nav-toggle.js" defer></script>
</body>
</html>
