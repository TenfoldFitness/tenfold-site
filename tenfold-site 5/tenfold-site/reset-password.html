<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Set a New Password — Tenfold Method</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <div class="login-page">
    <div class="center" style="margin-bottom:28px;">
      <a href="index.html" class="logo" style="text-decoration:none; color:inherit;">Tenfold</a>
      <p style="margin-top:4px;">Client portal</p>
    </div>

    <div class="login-box">
      <h1>Set a new password</h1>

      <p class="form-error" id="reset-error"></p>
      <p class="small" id="reset-success" style="display:none; color:var(--accent); margin-bottom:12px;"></p>

      <form id="reset-form">
        <div class="field">
          <label for="new-password">New password</label>
          <input type="password" id="new-password" minlength="6" placeholder="At least 6 characters" required />
        </div>
        <button type="submit" class="btn btn-primary" id="reset-submit">Update password</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script>
    // If someone lands here without a valid recovery session, send them
    // back to the regular login page instead of showing this form.
    supabaseClient.auth.getSession().then(({ data }) => {
      if (!data.session) window.location.href = 'portal-login.html';
    });

    document.getElementById('reset-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      const errorEl = document.getElementById('reset-error');
      const successEl = document.getElementById('reset-success');
      errorEl.style.display = 'none';
      successEl.style.display = 'none';

      const btn = document.getElementById('reset-submit');
      btn.disabled = true;
      btn.textContent = 'Updating...';

      const newPassword = document.getElementById('new-password').value;
      const { error } = await supabaseClient.auth.updateUser({ password: newPassword });

      btn.disabled = false;
      btn.textContent = 'Update password';

      if (error) {
        errorEl.textContent = error.message;
        errorEl.style.display = 'block';
        return;
      }

      successEl.textContent = 'Password updated! Taking you to your dashboard...';
      successEl.style.display = 'block';
      setTimeout(() => { window.location.href = 'portal-dashboard.html'; }, 1500);
    });
  </script>

</body>
</html>
